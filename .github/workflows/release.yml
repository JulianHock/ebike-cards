name: Release

# Ein Tag vX.Y.Z (z. B. per `npm version minor && git push --follow-tags`) baut das Bundle
# und veröffentlicht es als GitHub-Release – HACS bietet es dann als Update an.
# Tags mit Bindestrich (v1.16.0-beta.0) werden als Pre-Release veröffentlicht.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # für die Attestation des Bundles
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # für die Prüfung, ob der Tag auf main liegt
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Tag und package.json-Version vergleichen
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu package.json ($pkg)"
            exit 1
          fi
      - name: Finale Tags müssen auf main liegen
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *)
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "::error::Tag $GITHUB_REF_NAME liegt nicht auf main"
                exit 1
              fi
              ;;
          esac
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Herkunft des Bundles bescheinigen
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/ebike-cards.js
      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/ebike-cards.js \
            --title "$GITHUB_REF_NAME" --generate-notes $flags
